# 运行期配置模板。复制为 runtime.yaml 后填写；runtime.yaml 已被 gitignore
active:
  persona: shelwell_persona
  facts: shelwell_facts
  lora: null
  provider: openai_compatible
  model: deepseek-chat
  plugins: []
generation:
  temperature: null
  num_ctx: null
  num_predict: null
providers:
  openai_compatible:
    base_url: https://api.deepseek.com
    api_key: ''
    model: deepseek-flash
    timeout: 120
    preset: deepseek
    reasoning_effort: low
    vision_enabled: false
context:
  compress_enabled: false
  compress_threshold: 20
  compress_keep_recent: 8
memory:
  extractor_model: ''          # 语义提炼用模型；空=跟随 active.model。嵌入模型（bge-m3）不能提炼
  auto_consolidate: false      # 每日自动提炼开关
  consolidate_time: '23:00'    # 自动提炼时间（本地时间 HH:MM）
  consolidate_limit: 50        # 单次最多处理多少条情景记忆
