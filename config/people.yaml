# 人物标识表
# 说明：
#   - label 是你给模型使用的固定称呼，不是 QQ 昵称。
#   - 模型看到的是 [label]，例如 [佩奇]。
#   - aliases 只用于把旧昵称清洗成 [label]，不会进入 prompt。
#   - label 必须全表唯一，不能包含方括号、空格、换行。
#   - 未填写的人会显示为 [未知XXXX]。
#
# 你需要做：
#   1. 把 label 改成你希望模型使用的称呼。
#   2. 把该人的群昵称、私聊昵称、旧称呼补进 aliases。
#   3. 如果同一个人有多个 QQ，保留一个主 QQ，其他 QQ 可另建条目并填同样 label，
#      但 label 必须唯一；建议同人多 QQ 用 P001a/P001b，label 仍不同。
#
# 下面的 QQ 和昵称来自现有关系库，只是初始候选，请自行核对。
#
# self 是你自己（西尔维娅）的模型标识：
#   - 只用于语义事实里的第三人称，例如 [佩奇]给[西尔维娅]升级设备
#   - 不要把“我”加入 aliases；用户说“我”时指的是用户本人

