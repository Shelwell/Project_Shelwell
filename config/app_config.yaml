model:
  base: qwen3.8:27b
  persona: shelwell-persona
  embedding: bge-m3
ollama:
  url: http://localhost:11434
  chat_timeout: 300
  embedding_timeout: 30
generation:
  temperature: 0.7
  num_predict: 1024
  num_ctx: 65536
  think: false
  keep_alive: "0.5h"          # 模型常驻：避免冷加载（27B 冷启约 50 秒）
context:
  max_length: 120           # 短期上下文窗口（条）；配合 64k 上下文与前缀缓存
  memory_enabled: true
memory:
  top_k: 3
  min_similarity: 0.5
  collection_name: shelwell_memory
knowledge:
  enabled: true
  collection_name: shelwell_knowledge
  top_k: 2                      # 单轮最多注入几条世界档案
  min_similarity: 0.55          # 低于此相似度宁可不注入，避免无关设定
  path: config/persona_prompts/shelwell_knowledge.jsonl

# 关系等级：由代码按「聊天条数 + 认识时长」判定，模型不得自行升降
# 条数与时长各自套档后取较低档（短板）；信任/依赖要求两个维度同时达标
relationship:
  enabled: true
  db_path: memory/index/relationships.sqlite3
  thresholds:
    stranger_max_msgs: 50       # 陌生：≤50 条（或时长 ≤120h）
    stranger_max_hours: 120     # 5 天
    acquaint_max_msgs: 300      # 认识：>50 条 且 >120h
    acquaint_max_hours: 360     # 15 天
    known_max_msgs: 1000        # 了解：>300 条 且 >360h；信任：>1000 条 且 >1080h
    known_max_hours: 1080       # 45 天
    depend_min_msgs: 3000       # 依赖：>3000 条 且 >90 天 且被设为依赖对象
    depend_min_hours: 2160      # 90 天
reply:
  max_chars_per_bubble: 40      # 单个气泡字符上限；超长回复按标点再切分
  max_bubbles: 2                # 单轮最多气泡数；超出部分并入最后一条（不丢内容）
  single_bubble_max_chars: 45   # 整条回复不超过这个字数时，强制合并成一条（多数对话应是单条）
vision:
  enabled: true
  model: ''                     # 空=跟随当前对话模型（直连 27B，不另起模型避免冷加载）
  max_side: 1920                 # 只处理小图（QQ 表情包）；最长边超过就直接跳过，不缩放
  max_bytes: 2097152            # 原始文件上限 2MB
  max_images: 2                 # 单条消息最多处理几张图
  max_per_minute: 10            # 视觉调用频率上限，防止群刷图拖垮对话
  cache_path: memory/index/vision_cache.sqlite3   # 图片指纹 → 描述 缓存
ui:
  page_title: Shelwell
  page_icon: 💬
  welcome_message: 你好呀！我是 Shelwell，很高兴认识你。今天想聊点什么呢？
qq_bot:
  group_enabled: true
  trigger_keywords:
  - Shelwell
  - Shel
  - she
  - 小希
  - 薇
  auto_engage:
    enabled: true
    heat_threshold: 7.0
    max_heat: 10.0
    heat_at_me: 10.0
    heat_question: 1.0
    heat_topic: 2.0
    heat_normal: 0.3
    heat_rapid: -1.0
    skip_short_len: 4
    conversation_threshold: 4.0
    conversation_window_minutes: 3
    half_life_minutes: 60
    heat_reply_to_me: 0.3
  # 群聊接话门禁：active=用新策略决策；shadow=只记录不执行
  # 影子数据已验证过，当前为正式决策
  group_gate:
    mode: active                  # active / shadow
    log_path: logs/group_gate.jsonl
    threshold: 0.55               # 参与意愿分达到多少才考虑接话
    active_hours: ["19:00-24:00"]  # 群活跃时段
    quiet_hours: ["00:30-09:00"]   # 静默时段：除非 @ 我，否则不说话
    cooldown_seconds: 90
    rapid_window_seconds: 30
    rapid_min_msgs: 3
    min_len: 4
    name_aliases: ["Shelwell", "希儿", "小希", "Shel", "薇"]
