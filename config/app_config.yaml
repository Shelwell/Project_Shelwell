model:
  base: qwen3.8:27b
  persona: shelwell-persona
  embedding: bge-m3
ollama:
  url: http://localhost:11434
  chat_timeout: 300
  embedding_timeout: 30
generation:
  temperature: 0.7
  num_predict: 1024
  num_ctx: 8192
  think: false
  keep_alive: "10m"         # 模型驻留时长：私聊每条消息刷新倒计时，10分钟无消息后卸载
context:
  max_length: 30
  memory_enabled: true
memory:
  top_k: 3
  min_similarity: 0.35
  collection_name: shelwell_memory
reply:
  max_chars_per_bubble: 40      # 单个气泡字符上限；超长回复按标点再切分
  max_bubbles: 2                # 单轮最多气泡数；超出部分并入最后一条（不丢内容）
  single_bubble_max_chars: 45   # 整条回复不超过这个字数时，强制合并成一条（多数对话应是单条）
ui:
  page_title: Shelwell
  page_icon: 💬
  welcome_message: 你好呀！我是 Shelwell，很高兴认识你。今天想聊点什么呢？
qq_bot:
  group_enabled: true
  trigger_keywords:
  - Shelwell
  - Shel
  - she
  - 小希
  - 薇
  auto_engage:
    enabled: true
    heat_threshold: 7.0
    max_heat: 10.0
    heat_at_me: 10.0
    heat_question: 1.0
    heat_topic: 2.0
    heat_normal: 0.3
    heat_rapid: -1.0
    skip_short_len: 4
    conversation_threshold: 4.0
    conversation_window_minutes: 3
    half_life_minutes: 60
    heat_reply_to_me: 0.3
  # 群聊接话门禁：active=用新策略决策；shadow=只记录不执行
  # 影子数据已验证过，当前为正式决策
  group_gate:
    mode: active                  # active / shadow
    log_path: logs/group_gate.jsonl
    threshold: 0.55               # 参与意愿分达到多少才考虑接话
    active_hours: ["19:00-24:00"]  # 群活跃时段
    quiet_hours: ["00:30-09:00"]   # 静默时段：除非 @ 我，否则不说话
    cooldown_seconds: 90
    rapid_window_seconds: 30
    rapid_min_msgs: 3
    min_len: 4
    name_aliases: ["Shelwell", "希儿", "小希", "Shel"]
